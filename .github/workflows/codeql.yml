name: "CodeQL"

on:
  push:
    branches: [ main, development ]
    paths:
      - '.github/workflows/**'
      - 'pyproject.toml'
      - 'setup.py'
      - 'venta_protocol_v2_device/**'

  pull_request:
    branches: [ main, development ]
    paths:
      - '.github/workflows/**'
      - 'pyproject.toml'
      - 'setup.py'
      - 'venta_protocol_v2_device/**'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          config: |
            queries:
              - uses: security-extended
            paths-ignore:
              - docs

      - name: Autobuild
        uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
